<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pup Blast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <section id="screen-home" class="screen home">
    <header class="topbar">
      <div class="topbar-left">
        <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-boards" class="icon-btn" type="button" aria-label="Leaderboards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v4M8.5 20h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="bones-pill"><svg class="bone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5a2.6 2.6 0 0 0-2.4 3.6A2.6 2.6 0 1 0 8 12.3l3.7 3.7a2.6 2.6 0 1 0 4.2 2.9 2.6 2.6 0 1 0 3-4.2l-3.7-3.7a2.6 2.6 0 1 0-4.3-2.9 2.6 2.6 0 0 0-3.4-3.6z" fill="currentColor"/></svg><span data-bones>0</span></div>
    </header>
    <div class="home-hero">
      <h1 class="logo"><span class="logo-pup">Pup</span><span class="logo-blast">Blast</span></h1>
      <button id="home-buddy" class="buddy-stage" type="button" aria-label="Boop your buddy"></button>
      <p id="home-buddy-caption" class="buddy-caption"></p>
    </div>
    <div class="home-actions">
      <button id="btn-play" class="btn big" type="button"><span>Play</span><small id="play-sub" class="play-sub"></small></button>
      <button id="btn-endless" class="btn ghost endless" type="button">Endless · best <b id="home-best">0</b></button>
      <div class="home-row">
        <button id="btn-gacha" class="btn tile" type="button"><span data-gacha-name>Pup-a-Matic</span><span id="gacha-badge" class="badge" hidden></span></button>
        <button id="btn-kennel" class="btn tile" type="button"><span>Kennel</span><span id="kennel-count" class="count"></span></button>
      </div>
    </div>
  </section>

  <section id="screen-game" class="screen game" hidden>
    <header class="game-top">
      <button id="btn-quit" class="icon-btn" type="button" aria-label="Back to menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="score-wrap">
        <div id="score" class="score">0</div>
        <div id="best-line" class="best-sm">Best <span id="game-best">0</span></div>
        <div id="level-bar" class="level-bar" hidden>
          <div class="lb-track"><i id="lb-fill"></i><span class="lb-star" id="lb-s1">★</span><span class="lb-star" id="lb-s2">★</span><span class="lb-star" id="lb-s3">★</span></div>
          <div class="lb-name" id="lb-name"></div>
        </div>
      </div>
      <div class="bones-pill earned" title="Bones earned this run"><svg class="bone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5a2.6 2.6 0 0 0-2.4 3.6A2.6 2.6 0 1 0 8 12.3l3.7 3.7a2.6 2.6 0 1 0 4.2 2.9 2.6 2.6 0 1 0 3-4.2l-3.7-3.7a2.6 2.6 0 1 0-4.3-2.9 2.6 2.6 0 0 0-3.4-3.6z" fill="currentColor"/></svg><span id="run-bones">0</span></div>
    </header>
    <div class="board-wrap">
      <div id="board" class="board" aria-label="Puzzle board"></div>
      <div id="blower" class="blower" hidden aria-label="Leaf Blower"><svg viewBox="0 0 40 28" aria-hidden="true"><rect x="2" y="9" width="18" height="12" rx="4" fill="#e85d3a" stroke="#5a2414" stroke-width="1.4"/><path d="M20 12h12l4-3v12l-4-3H20z" fill="#9aa3ad" stroke="#3b3f45" stroke-width="1.4"/><circle cx="9" cy="15" r="3" fill="#ffd04a"/><path d="M6 21v4h8v-4" fill="none" stroke="#5a2414" stroke-width="1.4"/></svg></div>
      <div id="crate" class="crate-overlay" hidden></div>
      <div id="squirrel" class="squirrel-tease" hidden aria-hidden="true"><svg viewBox="0 0 60 50"><path d="M44 40 C60 36 58 8 44 10 C36 12 38 24 46 24 C40 26 36 34 44 40 Z" fill="#b8763f" stroke="#6b4329" stroke-width="2"/><ellipse cx="28" cy="36" rx="13" ry="11" fill="#c98a52" stroke="#6b4329" stroke-width="2"/><circle cx="22" cy="26" r="9" fill="#c98a52" stroke="#6b4329" stroke-width="2"/><path d="M17 19 L16 12 L22 17 Z" fill="#c98a52" stroke="#6b4329" stroke-width="1.6"/><circle cx="19" cy="25" r="1.8" fill="#1d1622"/><circle cx="14" cy="28" r="1.4" fill="#1d1622"/></svg></div>
      <div id="fx" class="fx" aria-live="polite"></div>
    </div>
    <div id="tray" class="tray">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
    <div class="buddy-bar">
      <div id="game-buddy" class="buddy-face"></div>
      <div class="buddy-info"><b id="game-buddy-name"></b><span id="game-buddy-perk"></span></div>
      <button id="btn-power" class="btn power" type="button">Power</button>
    </div>
  </section>

  <section id="screen-gacha" class="screen gacha" hidden>
    <header class="topbar">
      <button class="icon-btn" type="button" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="screen-title" data-gacha-name>Pup-a-Matic</h2>
      <div class="bones-pill"><svg class="bone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5a2.6 2.6 0 0 0-2.4 3.6A2.6 2.6 0 1 0 8 12.3l3.7 3.7a2.6 2.6 0 1 0 4.2 2.9 2.6 2.6 0 1 0 3-4.2l-3.7-3.7a2.6 2.6 0 1 0-4.3-2.9 2.6 2.6 0 0 0-3.4-3.6z" fill="currentColor"/></svg><span data-bones>0</span></div>
    </header>
    <div class="machine" aria-hidden="true">
      <svg viewBox="0 0 200 236">
        <rect x="40" y="150" width="120" height="76" rx="14" fill="var(--machine)"/>
        <rect x="50" y="160" width="100" height="6" rx="3" fill="#ffffff" opacity=".18"/>
        <rect x="76" y="184" width="46" height="30" rx="10" fill="var(--night)"/>
        <g class="drop-cap"><circle cx="99" cy="200" r="11" fill="#dcd8ee"/><path d="M88 200 h22" stroke="#aaa3cc" stroke-width="2.4"/><ellipse cx="95" cy="195" rx="4" ry="2.4" fill="#fff" opacity=".7"/></g>
        <g class="crank"><circle cx="142" cy="196" r="12" fill="var(--accent-deep)"/><circle cx="142" cy="196" r="9" fill="var(--accent)"/><rect x="139" y="174" width="6" height="22" rx="3" fill="#fff7ec"/><circle cx="142" cy="174" r="5.5" fill="#fff7ec"/></g>
        <circle cx="100" cy="88" r="74" fill="var(--glass)" stroke="var(--machine)" stroke-width="8"/>
        <g class="balls">
          <circle cx="70" cy="118" r="17" fill="var(--c5)"/><circle cx="104" cy="126" r="17" fill="var(--c7)"/>
          <circle cx="136" cy="114" r="17" fill="var(--c3)"/><circle cx="86" cy="90" r="17" fill="var(--c4)"/>
          <circle cx="120" cy="86" r="17" fill="var(--c6)"/><circle cx="58" cy="84" r="15" fill="var(--c2)"/>
          <circle cx="100" cy="58" r="16" fill="var(--legend)"/><circle cx="142" cy="78" r="14" fill="var(--c1)"/>
        </g>
        <ellipse cx="74" cy="44" rx="22" ry="10" fill="#ffffff" opacity=".25" transform="rotate(-30 74 44)"/>
      </svg>
    </div>
    <p id="pity" class="pity"></p>
    <div class="pull-actions">
      <button id="btn-pull-epic" class="btn weekly epic" type="button" hidden><span class="label">Epic dig</span></button>
      <button id="btn-pull-token" class="btn weekly" type="button" hidden><span class="label">Map dig</span></button>
      <button id="btn-pull-week" class="btn weekly" type="button"><span class="label">Weekly pull</span></button>
      <button id="btn-pull-free" class="btn ad" type="button"><span class="ad-chip">AD</span><span class="label">Bonus pull</span></button>
      <div id="bone-pulls" class="pull-row">
        <button id="btn-pull-1" class="btn" type="button"><span data-verb>Pull</span> ×1 <span class="cost">100</span></button>
        <button id="btn-pull-10" class="btn alt" type="button"><span data-verb>Pull</span> ×10 <span class="cost">900</span></button>
      </div>
      <p class="fine">Odds: Common 62% · Rare 27% · Epic 9% · Legendary 2%</p>
    </div>
  </section>

  <section id="screen-worlds" class="screen worlds" hidden>
    <header class="topbar">
      <button class="icon-btn" type="button" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="screen-title">Worlds</h2>
      <div class="bones-pill star-pill"><span class="pill-star">★</span><span id="worlds-stars">0</span></div>
    </header>
    <div id="world-list" class="world-list"></div>
  </section>

  <section id="screen-map" class="screen map" hidden>
    <header class="topbar">
      <button class="icon-btn" type="button" data-back="worlds" aria-label="Back to worlds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="screen-title" id="map-title">Living Room</h2>
      <div class="bones-pill star-pill"><span class="pill-star">★</span><span id="map-stars">0</span></div>
    </header>
    <div id="map-path" class="map-path"></div>
  </section>

  <section id="screen-kennel" class="screen kennel" hidden>
    <header class="topbar">
      <button class="icon-btn" type="button" data-back aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="screen-title">Kennel</h2>
      <div class="bones-pill"><svg class="bone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5a2.6 2.6 0 0 0-2.4 3.6A2.6 2.6 0 1 0 8 12.3l3.7 3.7a2.6 2.6 0 1 0 4.2 2.9 2.6 2.6 0 1 0 3-4.2l-3.7-3.7a2.6 2.6 0 1 0-4.3-2.9 2.6 2.6 0 0 0-3.4-3.6z" fill="currentColor"/></svg><span data-bones>0</span></div>
    </header>
    <p id="kennel-progress" class="kennel-progress"></p>
    <div id="kennel-grid" class="kennel-grid"></div>
  </section>

  <div id="coach" class="coach" hidden>
    <div class="coach-spot" hidden></div>
    <div class="coach-paw" hidden><svg viewBox="-16 -18 32 32" aria-hidden="true"><g fill="#fff4e2" stroke="#6b4329" stroke-width="1.6"><ellipse cx="0" cy="6" rx="9" ry="7.5"/><circle cx="-10" cy="-5" r="4"/><circle cx="-3.6" cy="-11" r="4"/><circle cx="3.6" cy="-11" r="4"/><circle cx="10" cy="-5" r="4"/></g></svg></div>
    <div class="coach-bubble" role="status">
      <div class="coach-face" aria-hidden="true"></div>
      <div class="coach-body">
        <p class="coach-text"></p>
        <div class="coach-actions"><button type="button" class="btn small coach-next" hidden>Got it</button><button type="button" class="coach-skip">Skip tutorial</button></div>
      </div>
    </div>
  </div>
  <button id="dev-btn" class="dev-btn" type="button" hidden aria-label="Developer tools">DEV</button>
  <div id="modal" class="modal" hidden><div id="modal-sheet" class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="js/backdrops.js"></script>
<script src="js/pups.js"></script>
<script src="js/core.js"></script>
<script src="js/tuning.js"></script>
<script src="js/levels.js"></script>
<script src="js/powers.js"></script>
<script src="js/gacha.js"></script>
<script src="js/state.js"></script>
<script src="js/analytics.js"></script>
<script src="js/ads.js"></script>
<script src="js/store.js"></script>
<script src="js/gamecenter.js"></script>
<script src="js/audio.js"></script>
<script src="js/pullfx.js"></script>
<script src="js/powerfx.js"></script>
<script src="js/main.js"></script>
</body>
</html>

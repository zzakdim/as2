<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Magic Boba app icon: Sakura Twilight style. iOS applies the rounded mask itself. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#5a3558"/><stop offset=".55" stop-color="#36223a"/><stop offset="1" stop-color="#1c1220"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="45%">
      <stop offset="0" stop-color="#ff8fb3" stop-opacity=".45"/><stop offset="1" stop-color="#ff8fb3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="taro" x1="0" x2="1"><stop offset="0" stop-color="#d4bfff"/><stop offset=".35" stop-color="#bfa2ff"/><stop offset="1" stop-color="#9c7fe6"/></linearGradient>
    <linearGradient id="straw" x1="0" x2="1"><stop offset="0" stop-color="#ffd0e0"/><stop offset="1" stop-color="#ff8fb3"/></linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop offset="0" stop-color="#ffc0d4"/><stop offset=".35" stop-color="#ff94b6"/><stop offset="1" stop-color="#e9779d"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ec"/><stop offset="1" stop-color="#ff9fc0"/></linearGradient>
    <clipPath id="cupClip"><path d="M318 392 L706 392 L668 846 Q664 880 630 880 L394 880 Q360 880 356 846 Z"/></clipPath>
    <pattern id="stripe" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <rect width="40" height="40" fill="#ffffff"/><rect width="40" height="22" fill="#ff8fb3"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="600" r="420" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#fff3f8">
    <circle cx="170" cy="190" r="5" opacity=".8"/><circle cx="860" cy="150" r="4" opacity=".7"/><circle cx="905" cy="430" r="3.5" opacity=".6"/>
    <circle cx="110" cy="520" r="3" opacity=".55"/><circle cx="300" cy="120" r="3" opacity=".6"/><circle cx="740" cy="95" r="3" opacity=".5"/>
  </g>
  <g fill="#ffe08a">
    <path d="M820 290 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12z"/>
    <path d="M188 340 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9z" opacity=".9"/>
  </g>
  <!-- petals -->
  <g fill="#ffc1d6" opacity=".85">
    <ellipse cx="160" cy="760" rx="22" ry="12" transform="rotate(-30 160 760)"/>
    <ellipse cx="880" cy="720" rx="20" ry="11" transform="rotate(25 880 720)"/>
  </g>
  <g transform="translate(512 590) scale(1.13) translate(-512 -590)">
  <!-- straw -->
  <g transform="rotate(14 560 330)">
    <rect x="532" y="150" width="56" height="330" rx="28" fill="url(#stripe)"/>
    <rect x="532" y="150" width="56" height="330" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
  </g>
  <!-- cup body: drink layers -->
  <g clip-path="url(#cupClip)">
    <rect x="300" y="392" width="430" height="500" fill="rgba(255,236,244,.18)"/>
    <rect x="300" y="470" width="430" height="200" fill="url(#pink)"/>
    <path d="M300 470 q22 -14 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 v20 h-440z" fill="#ffc0d4"/>
    <rect x="300" y="670" width="430" height="110" fill="url(#taro)"/>
    <rect x="300" y="780" width="430" height="110" fill="#4a3030"/>
    <g fill="#6e4a3c">
      <circle cx="380" cy="810" r="26"/><circle cx="448" cy="840" r="26"/><circle cx="516" cy="812" r="26"/><circle cx="584" cy="842" r="26"/><circle cx="648" cy="812" r="24"/>
      <circle cx="410" cy="862" r="24"/><circle cx="550" cy="868" r="24"/>
    </g>
    <g fill="#ffffff" opacity=".45">
      <circle cx="372" cy="800" r="7"/><circle cx="440" cy="830" r="7"/><circle cx="508" cy="802" r="7"/><circle cx="576" cy="832" r="7"/><circle cx="640" cy="802" r="6"/>
    </g>
    <!-- fizz -->
    <g fill="#fff" opacity=".55"><circle cx="400" cy="560" r="5"/><circle cx="610" cy="610" r="4"/><circle cx="470" cy="640" r="3.5"/><circle cx="560" cy="520" r="3"/></g>
    <!-- glass shine -->
    <rect x="340" y="400" width="26" height="440" rx="13" fill="#fff" opacity=".28"/>
  </g>
  <path d="M318 392 L706 392 L668 846 Q664 880 630 880 L394 880 Q360 880 356 846 Z" fill="none" stroke="#ffecf4" stroke-width="14" stroke-linejoin="round"/>
  <!-- dome lid -->
  <path d="M292 400 Q292 300 512 292 Q732 300 732 400 Z" fill="url(#lid)"/>
  <rect x="280" y="388" width="464" height="30" rx="15" fill="#ffb6cd"/>
  <path d="M500 336 c-16 -22 -46 -6 -32 16 l32 28 32 -28 c14 -22 -16 -38 -32 -16z" fill="#ffffff"/>
  <!-- face -->
  <g fill="#3d2230">
    <ellipse cx="452" cy="566" rx="20" ry="26"/><ellipse cx="572" cy="566" rx="20" ry="26"/>
  </g>
  <g fill="#ffffff"><circle cx="458" cy="556" r="7"/><circle cx="578" cy="556" r="7"/></g>
  <path d="M488 604 q24 26 48 0" fill="none" stroke="#3d2230" stroke-width="11" stroke-linecap="round"/>
  <g fill="#ff6f9c" opacity=".55"><ellipse cx="410" cy="612" rx="28" ry="15"/><ellipse cx="614" cy="612" rx="28" ry="15"/></g>
  </g>
</svg>
